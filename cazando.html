<!DOCTYPE html>
<html>

<head>
  <title>Juego Cazando</title>
  <link rel="stylesheet" href="cazando.css">
  <script src="utils.js"></script>
</head>

<body onload="iniciarJuego();">

  <h1>Juego Cazando</h1>
  <p>Autor: Carlos Chavez</p>

  <div class="contenedor">
    <canvas id="areaJuego" width="500" height="400"></canvas>

  </div>

  <div class="controles">
    <button id="btnArriba">⬆</button>
    <br>
    <button id="btnIzquierda">⬅</button>
    <button id="btnAbajo">⬇</button>
    <button id="btnDerecha">➡</button>
    <br>
    <button id="btnReiniciar"> Reiniciar </button>
  </div>


  <div class="panel">
    <span>Puntos: <span id="puntos">0</span></span>
    <span>Tiempo: <span id="tiempo">30</span></span>
  </div>

  <p id="mensaje"></p>

  <script src="cazando.js"></script>

</body>

</html>
